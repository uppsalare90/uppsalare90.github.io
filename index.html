<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDGA-ratingranking för svenska döva discgolfspelare</title>
  <link rel="icon" type="image/x-icon" href="swedenteam.png">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="script.js" defer></script>

</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="header-copy">
        <h1>PDGA-ratingranking för svenska döva discgolfspelare</h1>
      </div>
      <a href="nbm.html" class="btn">
        <img src="nbmflags.png" alt="" class="nbm-icon">
        <span>NBDDC-rankning</span>
        <span class="btn-arrow" aria-hidden="true">↗</span>
      </a>
    </header>

    <section class="ranking-section" aria-label="Spelarranking">
      <div class="section-heading">
        <h2>Rankning</h2>
        <p>Aktiva spelare med PDGA-rating</p>
      </div>
      <div class="player-list" id="playerList"></div>
    </section>

    <footer class="footer-text">
      Data hämtas från IK Adils Open och andra tävlingar. Endast aktiva spelare med rating visas i listan.
    </footer>
  </main>

</body>
</html>
